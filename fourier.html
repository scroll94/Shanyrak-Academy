<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ряды Фурье · Шаңырақ Code</title>
<meta name="description" content="Ряды Фурье руками: вращающиеся круги складываются в квадратную волну, пилу или рисунок. Пример с курса «Математика».">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;600&display=swap">
<style>
  :root { color-scheme: dark; --night: #0a1430; --gold: #e8b64a; --sky: #3cc6dc; --felt: #e65f43; --milk: #f4ecdf; --muted: #a7b1d1; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); color: var(--milk); font: 400 15px/1.45 "Onest", system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  .ui { position: fixed; left: 16px; right: 16px; top: 14px; z-index: 2; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 20px; }
  .ui h1 { margin: 0; font: 800 clamp(20px, 3vw, 30px)/1.1 "Unbounded", sans-serif; }
  .ui p { margin: 6px 0 0; max-width: 34rem; color: var(--muted); font-size: 14px; }
  .ctl { display: grid; gap: 10px; align-content: start; min-width: min(100%, 320px); }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 10px; background: rgb(255 255 255 / .09); color: var(--milk); font: 600 14px/1 "Onest", sans-serif; cursor: pointer; transition: background-color 160ms, transform 160ms cubic-bezier(.23, 1, .32, 1); }
  .seg button[aria-pressed="true"] { background: var(--gold); color: #111; }
  .seg button:active { transform: scale(.97); }
  .seg button:focus-visible, input:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  label.n { display: grid; grid-template-columns: auto minmax(0, 1fr) 2.6em; align-items: center; gap: 10px; font-weight: 600; }
  label.n input { width: 100%; height: 28px; accent-color: var(--gold); }
  label.n output { text-align: right; color: var(--gold); font-variant-numeric: tabular-nums; }
  .formula { position: fixed; left: 16px; bottom: 14px; z-index: 2; max-width: calc(100% - 32px); padding: 10px 14px; border-radius: 12px; background: rgb(10 20 48 / .8); font: 600 15px/1.4 Consolas, "Cascadia Mono", monospace; }
  .formula small { display: block; margin-top: 4px; color: var(--muted); font: 400 13px/1.35 "Onest", sans-serif; }
  body.card .ui { display: none; }
  body.card .formula { left: 10px; bottom: 10px; padding: 6px 10px; font-size: 12.5px; }
  body.card .formula small { display: none; }
  body.card .formula b { color: var(--gold); }
</style>
</head>
<body>
<canvas id="c" aria-label="Ряд Фурье: вращающиеся круги, сумма которых рисует график или фигуру" role="img"></canvas>
<div class="ui">
  <div>
    <h1>Ряды Фурье</h1>
    <p>Любую волну и даже рисунок можно собрать из простых вращений. Каждый круг крутится со своей скоростью, а конец последнего рисует результат. Добавляй круги и смотри, как картинка становится точнее.</p>
  </div>
  <div class="ctl">
    <div class="seg" role="group" aria-label="Что рисуем">
      <button type="button" data-shape="square" aria-pressed="true">Квадратная волна</button>
      <button type="button" data-shape="saw" aria-pressed="false">Пила</button>
      <button type="button" data-shape="heart" aria-pressed="false">Сердце</button>
      <button type="button" data-shape="star" aria-pressed="false">Звезда</button>
    </div>
    <label class="n"><span>Кругов</span><input id="n" type="range" min="1" max="40" value="5"><output id="nv">5</output></label>
  </div>
</div>
<p class="formula" id="formula" aria-live="polite"></p>

<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const card = qs.has('card');
  if (card) document.body.classList.add('card');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = document.getElementById('c'), g = cv.getContext('2d');
  let W = 0, H = 0;
  const resize = () => { const d = Math.min(devicePixelRatio, 2); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; g.setTransform(d, 0, 0, d, 0, 0); };
  addEventListener('resize', resize); resize();

  // ---------- коэффициенты ----------
  // волны: точный ряд; фигуры: дискретное преобразование Фурье контура
  const waveTerms = (shape, N) => {
    const t = [];
    if (shape === 'square') for (let i = 0; i < N; i++) { const k = 2 * i + 1; t.push({ f: k, r: 4 / (k * Math.PI), ph: 0 }); }
    else for (let k = 1; k <= N; k++) t.push({ f: k, r: (2 / (k * Math.PI)) * (k % 2 ? 1 : -1), ph: 0 });
    return t;
  };
  const shapePath = shape => {
    const pts = [], M = 256;
    for (let i = 0; i < M; i++) {
      const a = (i / M) * Math.PI * 2;
      if (shape === 'heart') pts.push([16 * Math.sin(a) ** 3 / 17, -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) / 17]);
      else { // пятиконечная звезда: радиус меняется по ломаной между вершинами
        const k = (a / (Math.PI * 2)) * 10, j = Math.floor(k), u = k - j;
        const r1 = j % 2 ? 0.42 : 1, r2 = j % 2 ? 1 : 0.42;
        const a1 = (j / 10) * Math.PI * 2 - Math.PI / 2, a2 = ((j + 1) / 10) * Math.PI * 2 - Math.PI / 2;
        const x = r1 * Math.cos(a1) * (1 - u) + r2 * Math.cos(a2) * u, y = r1 * Math.sin(a1) * (1 - u) + r2 * Math.sin(a2) * u;
        pts.push([x, y]);
      }
    }
    return pts;
  };
  const dft = pts => {
    const M = pts.length, out = [];
    for (let k = 0; k < M; k++) {
      let re = 0, im = 0;
      for (let n = 0; n < M; n++) { const a = (-2 * Math.PI * k * n) / M; re += pts[n][0] * Math.cos(a) - pts[n][1] * Math.sin(a); im += pts[n][0] * Math.sin(a) + pts[n][1] * Math.cos(a); }
      re /= M; im /= M;
      out.push({ f: k > M / 2 ? k - M : k, r: Math.hypot(re, im), ph: Math.atan2(im, re) });
    }
    return out.sort((a, b) => b.r - a.r);
  };
  const cache = {};
  let shape = 'square', N = 5, terms = [], trace = [], t = 0;
  const FORM = {
    square: n => `f(t) = 4/π · (sin t + sin 3t/3 + sin 5t/5 + …) · кругов: ${n}`,
    saw: n => `f(t) = 2/π · (sin t − sin 2t/2 + sin 3t/3 − …) · кругов: ${n}`,
    heart: n => `x + iy = Σ cₖ · e^(i·k·t) · кругов: ${n}`,
    star: n => `x + iy = Σ cₖ · e^(i·k·t) · кругов: ${n}`
  };
  const NOTE = {
    square: 'Нечётные частоты 1, 3, 5… Чем больше кругов, тем ровнее углы, но маленький «зубчик» у ступеньки остаётся всегда: это эффект Гиббса.',
    saw: 'Все частоты по очереди, со сменой знака. Сумма синусоид выпрямляется в наклонную линию.',
    heart: 'Контур сердца разложен на вращения: самые большие круги задают форму, маленькие — детали.',
    star: 'Острые углы звезды требуют много маленьких быстрых кругов. Мало кругов — получается скруглённый цветок.'
  };
  const formEl = document.getElementById('formula');
  const setup = () => {
    const isWave = shape === 'square' || shape === 'saw';
    if (isWave) terms = waveTerms(shape, N);
    else { cache[shape] = cache[shape] || dft(shapePath(shape)); terms = cache[shape].slice(0, N); }
    trace = []; t = 0;
    formEl.innerHTML = card ? `Σ sin(kt)/k · кругов: <b>${N}</b>` : FORM[shape](N) + `<small>${NOTE[shape]}</small>`;
  };

  // ---------- управление ----------
  const nIn = document.getElementById('n'), nOut = document.getElementById('nv');
  const btns = [...document.querySelectorAll('[data-shape]')];
  btns.forEach(b => b.addEventListener('click', () => {
    shape = b.dataset.shape;
    btns.forEach(o => o.setAttribute('aria-pressed', String(o === b)));
    const fig = shape === 'heart' || shape === 'star';
    nIn.max = fig ? 120 : 40;
    N = Math.min(+nIn.value, +nIn.max); if (fig && N < 8) N = 8;
    nIn.value = N; nOut.textContent = N;
    setup();
  }));
  nIn.addEventListener('input', () => { N = +nIn.value; nOut.textContent = N; setup(); });
  setup();

  // ---------- кадр ----------
  let active = true, last = performance.now(), cardT = 0, cardStep = 0;
  const cardPlan = [1, 2, 3, 5, 8, 14, 25];
  addEventListener('message', ev => { if (ev.data && typeof ev.data.active === 'boolean') active = ev.data.active; });
  const loop = now => {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!active) return;
    if (card) {
      // заставка: квадратная волна, круги добавляются по одному шагу каждые 2,4 секунды
      cardT += dt;
      if (cardT > 2.4 || !terms.length) { cardT = 0; N = cardPlan[cardStep++ % cardPlan.length]; setup(); }
    }
    const isWave = shape === 'square' || shape === 'saw';
    const speed = isWave ? 1.6 : 0.55;
    t += reduce ? 0 : dt * speed;
    g.clearRect(0, 0, W, H);
    // клетка
    g.strokeStyle = 'rgba(244,236,223,.05)'; g.lineWidth = 1;
    for (let x = 0; x < W; x += 32) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
    for (let y = 0; y < H; y += 32) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
    const narrow = W < H * 1.05;
    const S = isWave ? (card ? Math.min(H * 0.25, W * 0.12) : Math.min(H * 0.19, W * (narrow ? 0.17 : 0.11))) : Math.min(W, H) * (card ? 0.36 : 0.3);
    const ox = isWave ? (narrow ? W * 0.27 : W * 0.25) : W * 0.5, oy = H * (card ? 0.5 : 0.56);
    let x = ox, y = oy;
    terms.forEach((c, i) => {
      const r = Math.abs(c.r) * S, a = c.f * t + c.ph + (isWave ? 0 : 0);
      const sgn = isWave && c.r < 0 ? -1 : 1;
      const nx = x + sgn * r * Math.cos(isWave ? a : a), ny = y + sgn * r * Math.sin(isWave ? -a : a) * (isWave ? 1 : 1);
      g.strokeStyle = `rgba(60,198,220,${Math.max(0.12, 0.5 - i * 0.02)})`; g.lineWidth = 1.2;
      g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.stroke();
      g.strokeStyle = 'rgba(244,236,223,.65)'; g.lineWidth = 1.4;
      g.beginPath(); g.moveTo(x, y); g.lineTo(nx, ny); g.stroke();
      x = nx; y = ny;
    });
    g.fillStyle = '#e8b64a'; g.beginPath(); g.arc(x, y, 4, 0, Math.PI * 2); g.fill();
    if (isWave) {
      // волна уезжает вправо: каждая точка — высота конца цепочки в свой момент
      // начало волны правее всей цепочки кругов
      const reach = Math.min(2.2, terms.reduce((a, c) => a + Math.abs(c.r), 0));
      const wx = ox + S * reach + 24, PX = 90; // 90 пикселей на единицу времени
      trace.unshift([t, y]);
      while (trace.length > 2 && (t - trace[trace.length - 1][0]) * PX > W - wx) trace.pop();
      g.strokeStyle = 'rgba(232,182,74,.35)'; g.setLineDash([4, 4]);
      g.beginPath(); g.moveTo(x, y); g.lineTo(wx, y); g.stroke(); g.setLineDash([]);
      g.strokeStyle = '#e8b64a'; g.lineWidth = 2.6; g.lineJoin = 'round';
      g.beginPath(); trace.forEach((v, i) => { const px = wx + (t - v[0]) * PX; i ? g.lineTo(px, v[1]) : g.moveTo(px, v[1]); }); g.stroke();
    } else {
      trace.push([x, y]);
      const full = Math.ceil((Math.PI * 2) / (dt * speed || 0.016)) + 4;
      if (trace.length > Math.max(full, 60) * 1.02) trace.shift();
      g.strokeStyle = '#e8b64a'; g.lineWidth = 2.6; g.lineJoin = 'round';
      g.beginPath(); trace.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.stroke();
    }
  };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
